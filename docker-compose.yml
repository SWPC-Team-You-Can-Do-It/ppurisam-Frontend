version: '3.8'

services:
  frontend:
    build:
      context: .
    ports:
      - "3000:3000"
    container_name: ppurisam_frontend
    networks:
      - ppurisam_network
    volumes:
      - .:/app
      - node_modules:/app/node_modules # Named volume 사용
    environment:
      - CHOKIDAR_USEPOLLING=true # 파일 변경 감지
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}

    command: ["npm", "run", "dev"] # npm start 대신 Vite 서버 실행

networks:
  ppurisam_network:
    driver: bridge

volumes:
  node_modules:
